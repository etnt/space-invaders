<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Invaders</title>
<style>
  :root {
    --green: #33ff33;
    --dim-green: #1a7a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: var(--green);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 4px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(51, 255, 51, 0.6);
  }
  /* CRT-style screen wrapper: glow + scanlines */
  .screen {
    position: relative;
    line-height: 0;
    border: 2px solid var(--dim-green);
    border-radius: 6px;
    box-shadow:
      0 0 24px rgba(51, 255, 51, 0.25),
      inset 0 0 24px rgba(51, 255, 51, 0.08);
    overflow: hidden;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.16) 0px,
      rgba(0, 0, 0, 0.16) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    /* Logical resolution is 224x256 (ratio 0.875). Letterbox to fit viewport. */
    width: min(96vw, 84vh);
    aspect-ratio: 224 / 256;
  }
  footer {
    font-size: 11px;
    color: var(--dim-green);
    text-align: center;
    letter-spacing: 1px;
  }
  /* On-screen touch controls, only for coarse pointers (phones/tablets) */
  #touch {
    display: none;
    gap: 14px;
    margin-top: 4px;
  }
  #touch button {
    font-family: inherit;
    font-size: 18px;
    color: var(--green);
    background: #001500;
    border: 2px solid var(--dim-green);
    border-radius: 8px;
    padding: 14px 26px;
    touch-action: none;
  }
  #touch button:active { background: var(--dim-green); color: #000; }
  @media (pointer: coarse) {
    #touch { display: flex; }
    footer .keyboard-only { display: none; }
  }
</style>
</head>
<body>
  <h1>SPACE INVADERS</h1>
  <div class="screen"><canvas id="game" width="224" height="256"></canvas></div>
  <div id="touch">
    <button id="btn-left" aria-label="Move left">&#9664;</button>
    <button id="btn-fire" aria-label="Fire">FIRE</button>
    <button id="btn-right" aria-label="Move right">&#9654;</button>
  </div>
  <footer>
    <span class="keyboard-only">ARROWS / A,D MOVE &nbsp;&middot;&nbsp; SPACE FIRE &nbsp;&middot;&nbsp; P PAUSE &nbsp;&middot;&nbsp; M MUTE &nbsp;&middot;&nbsp; ENTER START</span>
  </footer>

<script>
(() => {
'use strict';

/* ============================================================
 * Space Invaders — single-file vanilla JS implementation.
 * Logical resolution 224x256, fixed 60 Hz timestep, all art is
 * procedural (bitmap string sprites drawn with fillRect).
 * ============================================================ */

// ---------- Canvas setup ----------
const W = 224, H = 256;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const COL = {
  green: '#33ff33',
  dim:   '#1a7a1a',
  white: '#f8f8f8',
  red:   '#ff4444',
  yellow:'#ffdd44'
};

// ---------- Sprite data (bitmap strings, '#' = pixel) ----------
const SPR = {
  squid: [
    ['...##...','..####..','.######.','##.##.##','########','..#..#..','.#.##.#.','#.#..#.#'],
    ['...##...','..####..','.######.','##.##.##','########','.#.##.#.','#......#','.#....#.']
  ],
  crab: [
    ['..#.....#..','...#...#...','..#######..','.##.###.##.','###########','#.#######.#','#.#.....#.#','...##.##...'],
    ['..#.....#..','#..#...#..#','#.#######.#','###.###.###','###########','.#########.','..#.....#..','.#.......#.']
  ],
  octopus: [
    ['....####....','.##########.','############','###..##..###','############','...##..##...','..##.##.##..','##........##'],
    ['....####....','.##########.','############','###..##..###','############','..###..###..','.##..##..##.','..##....##..']
  ],
  player: [
    ['......#......','.....###.....','.....###.....','.###########.','#############','#############','#############','#############']
  ],
  ufo: [
    ['.....######.....','...##########...','..############..','.##.##.##.##.##.','################','...###....###...','....#......#....']
  ],
  ship: [
    ['...##...','..####..','.######.','########','########']
  ],
  zig: [
    ['.#.','#..','.#.','..#','.#.','#..','.#.'],
    ['.#.','..#','.#.','#..','.#.','..#','.#.']
  ],
  plunger: [
    ['###','.#.','.#.','###','.#.','.#.','###'],
    ['.#.','.#.','###','.#.','.#.','###','.#.']
  ]
};

// Draw a bitmap sprite at integer coordinates.
function drawSprite(frames, frame, x, y, color) {
  const pat = frames[frame] || frames[0];
  ctx.fillStyle = color;
  for (let row = 0; row < pat.length; row++) {
    const line = pat[row];
    for (let col = 0; col < line.length; col++) {
      if (line[col] === '#') ctx.fillRect(x + col, y + row, 1, 1);
    }
  }
}
function spriteW(frames) { return frames[0][0].length; }
function spriteH(frames) { return frames[0].length; }

// ---------- Game constants ----------
const STEP = 1 / 60;                 // fixed timestep (s)
const CELL_W = 16, CELL_H = 16;      // alien grid cell size
const COLS = 11, ROWS = 5;
const GRID_X0 = (W - COLS * CELL_W) / 2; // 24
const GRID_TOP = 48;
const BUNKER_Y = 192;
const PLAYER_Y = 218;
const GROUND_Y = 236;
const PLAYER_SPEED = 100;            // px/s
const PLAYER_BULLET_SPEED = 240;
const UFO_SPEED = 36;
const UFO_Y = 32;
const UFO_SCORES = [50, 100, 150, 300];
const EXTRA_LIFE_AT = 1500;
const MAX_LIVES = 5;
const START_LIVES = 3;

// Alien type metadata: points, grid offsets, sprite refs.
const TYPES = {
  squid:   { points: 30, frames: SPR.squid },
  crab:    { points: 20, frames: SPR.crab },
  octopus: { points: 10, frames: SPR.octopus }
};
const ROW_TYPES = ['squid', 'crab', 'crab', 'octopus', 'octopus'];

const STATE = {
  MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused',
  WAVE_CLEAR: 'waveClear', GAME_OVER: 'gameOver'
};

// ---------- Game state ----------
let state = STATE.MENU;
let stateTimer = 0;        // used by waveClear banner
let elapsed = 0;           // global clock for blinking text

let score = 0, lives = START_LIVES, wave = 1, extraLifeGiven = false;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('si-hiscore'), 10) || 0; } catch (e) {}

let player = null;
let playerBullet = null;   // single player bullet at a time
let alienBullets = [];     // up to 3
let grid = null;           // alien formation
let bunkers = [];
let ufo = null;
let ufoTimer = 0;
let alienFireTimer = 0;
let popups = [];           // floating score texts
let deathTimer = 0;        // player death animation countdown

// ---------- Input ----------
const keys = new Set();
const touch = { left: false, right: false, fire: false };

const GAME_KEYS = new Set([
  'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
  'Space', 'Enter', 'KeyP', 'Escape', 'KeyA', 'KeyD', 'KeyM'
]);

function inputLeft()  { return keys.has('ArrowLeft')  || keys.has('KeyA') || touch.left; }
function inputRight() { return keys.has('ArrowRight') || keys.has('KeyD') || touch.right; }
function inputFire()  { return keys.has('Space') || touch.fire; }

window.addEventListener('keydown', (e) => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  keys.add(e.code);
  if (e.repeat) return;         // ignore auto-repeat for edge-triggered actions
  if (e.code === 'Enter') onEnter();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') muted = !muted;
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === STATE.PLAYING) state = STATE.PAUSED;
});

function onEnter() {
  if (state === STATE.MENU || state === STATE.GAME_OVER) startGame();
}
function togglePause() {
  if (state === STATE.PLAYING) state = STATE.PAUSED;
  else if (state === STATE.PAUSED) state = STATE.PLAYING;
}

// ---------- Touch controls ----------
function bindHold(id, prop) {
  const el = document.getElementById(id);
  const on  = (e) => { e.preventDefault(); initAudio(); touch[prop] = true; };
  const off = (e) => { e.preventDefault(); touch[prop] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindHold('btn-left', 'left');
bindHold('btn-right', 'right');
const fireBtn = document.getElementById('btn-fire');
fireBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (state === STATE.MENU || state === STATE.GAME_OVER) { startGame(); return; }
  touch.fire = true;
});
fireBtn.addEventListener('pointerup',     () => { touch.fire = false; });
fireBtn.addEventListener('pointercancel', () => { touch.fire = false; });

// ---------- Audio (optional WebAudio beeps; game runs fine without) ----------
let audioCtx = null;
let muted = false;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) { audioCtx = null; }
}

function beep(freq, dur, type, vol, slideTo) {
  if (muted || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const stepFreqs = [130, 110, 95, 80];
let stepSoundIdx = 0;
const sfx = {
  shoot:       () => beep(880, 0.12, 'square', 0.06, 220),
  alienHit:    () => beep(220, 0.1, 'square', 0.08, 60),
  playerHit:   () => beep(200, 0.6, 'sawtooth', 0.1, 40),
  ufo:         () => beep(600, 0.15, 'triangle', 0.05, 900),
  ufoHit:      () => beep(500, 0.4, 'square', 0.09, 100),
  wave:        () => { beep(440, 0.1, 'square', 0.06); setTimeout(() => beep(660, 0.15, 'square', 0.06), 110); },
  extraLife:   () => { beep(523, 0.1, 'square', 0.07); setTimeout(() => beep(784, 0.2, 'square', 0.07), 110); },
  step:        () => { beep(stepFreqs[stepSoundIdx], 0.08, 'square', 0.05); stepSoundIdx = (stepSoundIdx + 1) % 4; }
};

// ---------- Entities ----------
function makeGrid(waveNum) {
  const aliens = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      aliens.push({ row: r, col: c, type: ROW_TYPES[r], alive: true });
    }
  }
  const startDrop = Math.min((waveNum - 1) * 8, 48); // each wave starts lower, capped
  return {
    aliens,
    x: GRID_X0,
    y: GRID_TOP + startDrop,
    dir: 1,
    frame: 0,
    stepTimer: 1.0
  };
}

function makeBunkers() {
  const bw = 22, bh = 16, list = [];
  for (let i = 0; i < 4; i++) {
    const px = new Uint8Array(bw * bh);
    for (let y = 0; y < bh; y++) {
      for (let x = 0; x < bw; x++) {
        let solid = 1;
        if (x + y < 4) solid = 0;              // top-left slope
        if ((bw - 1 - x) + y < 4) solid = 0;   // top-right slope
        if (y >= bh - 4) {                     // bottom arch opening
          const t = y - (bh - 4);
          if (x >= 9 - t && x <= 12 + t) solid = 0;
        }
        px[y * bw + x] = solid;
      }
    }
    list.push({ x: 27 + i * 46, y: BUNKER_Y, w: bw, h: bh, px });
  }
  return list;
}

function makePlayer() {
  return { x: (W - 13) / 2, y: PLAYER_Y, w: 13, h: 8, alive: true, invuln: 0 };
}

function aliveAliens() {
  return grid.aliens.filter(a => a.alive);
}
function countAlive() {
  let n = 0;
  for (const a of grid.aliens) if (a.alive) n++;
  return n;
}

// Alien rect in world coordinates.
function alienRect(a) {
  const t = TYPES[a.type];
  const offX = Math.round((CELL_W - spriteW(t.frames)) / 2);
  return {
    x: grid.x + a.col * CELL_W + offX,
    y: grid.y + a.row * CELL_H,
    w: spriteW(t.frames),
    h: spriteH(t.frames)
  };
}

function gridBounds() {
  let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const a of grid.aliens) {
    if (!a.alive) continue;
    const r = alienRect(a);
    if (r.x < minX) minX = r.x;
    if (r.x + r.w > maxX) maxX = r.x + r.w;
    if (r.y + r.h > maxY) maxY = r.y + r.h;
  }
  return { left: minX, right: maxX, bottom: maxY };
}

// ---------- Flow control ----------
function startGame() {
  score = 0;
  lives = START_LIVES;
  extraLifeGiven = false;
  popups = [];
  startWave(1);
  state = STATE.PLAYING;
}

function startWave(n) {
  wave = n;
  grid = makeGrid(n);
  bunkers = makeBunkers();
  player = makePlayer();
  playerBullet = null;
  alienBullets = [];
  ufo = null;
  ufoTimer = 20 + Math.random() * 10;
  alienFireTimer = 1.5;
  deathTimer = 0;
  popups = [];
}

function gameOver() {
  state = STATE.GAME_OVER;
  // hiScore is kept in sync live during play, so >= catches a brand-new best
  if (score >= hiScore && score > 0) {
    hiScore = score;
    try { localStorage.setItem('si-hiscore', String(hiScore)); } catch (e) {}
  }
}

function addScore(points) {
  score += points;
  if (score > hiScore) hiScore = score;
  if (!extraLifeGiven && score >= EXTRA_LIFE_AT && lives < MAX_LIVES) {
    lives++;
    extraLifeGiven = true;
    popups.push({ text: 'EXTRA LIFE!', x: W / 2, y: 150, t: 1.6, center: true });
    sfx.extraLife();
  }
}

// ---------- Bunker erosion ----------
function bunkerSolidAt(b, wx, wy) {
  const lx = Math.floor(wx - b.x), ly = Math.floor(wy - b.y);
  if (lx < 0 || ly < 0 || lx >= b.w || ly >= b.h) return false;
  return b.px[ly * b.w + lx] === 1;
}

function erodeBunker(b, wx, wy, radius) {
  const cx = Math.round(wx - b.x), cy = Math.round(wy - b.y);
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx * dx + dy * dy <= radius * radius + 1) {
        const px = cx + dx, py = cy + dy;
        if (px >= 0 && py >= 0 && px < b.w && py < b.h) b.px[py * b.w + px] = 0;
      }
    }
  }
}

// Aliens grinding through bunkers erase the overlap.
function erodeBunkersByAliens() {
  for (const a of grid.aliens) {
    if (!a.alive) continue;
    const r = alienRect(a);
    for (const b of bunkers) {
      const x0 = Math.max(r.x, b.x), x1 = Math.min(r.x + r.w, b.x + b.w);
      const y0 = Math.max(r.y, b.y), y1 = Math.min(r.y + r.h, b.y + b.h);
      if (x0 < x1 && y0 < y1) {
        for (let py = Math.floor(y0); py < Math.ceil(y1); py++) {
          for (let pxx = Math.floor(x0); pxx < Math.ceil(x1); pxx++) {
            const lx = pxx - b.x, ly = py - b.y;
            if (lx >= 0 && ly >= 0 && lx < b.w && ly < b.h) b.px[ly * b.w + lx] = 0;
          }
        }
      }
    }
  }
}

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ---------- Alien formation ----------
function stepInterval() {
  const t = countAlive() / (COLS * ROWS);       // 1 (full) .. ~0
  const base = 0.033 + t * 0.82;                // seconds between 2px steps
  const waveFactor = Math.max(0.55, Math.pow(0.92, wave - 1));
  return Math.max(0.033, base * waveFactor);
}

function stepGrid() {
  grid.frame ^= 1;
  const b = gridBounds();
  const margin = 4, stride = 2;
  if (grid.dir > 0 && b.right + stride >= W - margin) {
    grid.y += 8;                                // drop one row and reverse
    grid.dir = -1;
  } else if (grid.dir < 0 && b.left - stride <= margin) {
    grid.y += 8;
    grid.dir = 1;
  } else {
    grid.x += stride * grid.dir;
  }
  grid.stepTimer = stepInterval();
  sfx.step();
  erodeBunkersByAliens();
  if (gridBounds().bottom >= PLAYER_Y) {        // aliens reached the player line
    gameOver();
  }
}

function fireInterval() {
  const base = Math.max(0.4, 1.6 - 0.15 * (wave - 1));
  return base * (0.5 + Math.random());
}

function fireAlienBullet() {
  // Pick a random column that still has aliens; bottom-most alien fires.
  const cols = [];
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 0; r--) {
      const a = grid.aliens[r * COLS + c];
      if (a && a.alive) { cols.push(a); break; }
    }
  }
  if (!cols.length) return;
  const shooter = cols[Math.floor(Math.random() * cols.length)];
  const rect = alienRect(shooter);
  const type = Math.random() < 0.5 ? 'zig' : 'plunger';
  alienBullets.push({
    x: rect.x + rect.w / 2 - 1.5,
    y: rect.y + rect.h,
    w: 3, h: 7,
    type,
    frame: 0,
    anim: 0,
    speed: Math.min(140, 85 + (wave - 1) * 8)
  });
}

function triggerWaveClear() {
  state = STATE.WAVE_CLEAR;
  stateTimer = 1.5;
  playerBullet = null;
  alienBullets = [];
  ufo = null;
  sfx.wave();
}

function killAlien(a) {
  a.alive = false;
  addScore(TYPES[a.type].points);
  sfx.alienHit();
  if (countAlive() === 0) triggerWaveClear();   // wave cleared
}

function killPlayer() {
  if (player.invuln > 0 || !player.alive) return;
  player.alive = false;
  deathTimer = 1.2;
  alienBullets = [];
  sfx.playerHit();
}

// ---------- Update ----------
function update(dt) {
  elapsed += dt;

  if (state === STATE.WAVE_CLEAR) {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      startWave(wave + 1);                      // score & lives carry over
      state = STATE.PLAYING;
    }
    return;
  }
  if (state !== STATE.PLAYING) return;

  // Player death sequence freezes the invasion briefly.
  if (!player.alive) {
    deathTimer -= dt;
    if (deathTimer <= 0) {
      lives--;
      if (lives <= 0) { gameOver(); return; }
      player.alive = true;
      player.invuln = 2;
      player.x = (W - player.w) / 2;
    }
    return;
  }
  if (player.invuln > 0) player.invuln -= dt;

  // --- Player movement ---
  if (inputLeft() && !inputRight()) player.x -= PLAYER_SPEED * dt;
  if (inputRight() && !inputLeft()) player.x += PLAYER_SPEED * dt;
  player.x = Math.max(4, Math.min(W - 4 - player.w, player.x));

  // --- Player fire (one bullet on screen) ---
  if (inputFire() && !playerBullet) {
    playerBullet = { x: Math.floor(player.x + player.w / 2), y: player.y - 4, w: 1, h: 4 };
    sfx.shoot();
  }

  // --- Player bullet ---
  if (playerBullet) {
    playerBullet.y -= PLAYER_BULLET_SPEED * dt;
    const pb = playerBullet;
    if (pb.y < 14) {
      playerBullet = null;                      // flew past the top
    } else {
      // UFO hit
      if (ufo && aabb(pb.x, pb.y, pb.w, pb.h, ufo.x, UFO_Y, ufo.w, ufo.h)) {
        addScore(ufo.value);
        popups.push({ text: String(ufo.value), x: ufo.x + ufo.w / 2, y: UFO_Y, t: 1.0 });
        ufo = null;
        ufoTimer = 20 + Math.random() * 10;
        playerBullet = null;
        sfx.ufoHit();
      } else {
        // Alien hit
        let hit = false;
        for (const a of grid.aliens) {
          if (!a.alive) continue;
          const r = alienRect(a);
          if (aabb(pb.x, pb.y, pb.w, pb.h, r.x, r.y, r.w, r.h)) {
            killAlien(a);
            hit = true;
            break;
          }
        }
        // Bullet vs bullet
        if (!hit && playerBullet) {
          for (let i = 0; i < alienBullets.length; i++) {
            const ab = alienBullets[i];
            if (aabb(pb.x, pb.y, pb.w, pb.h, ab.x, ab.y, ab.w, ab.h)) {
              alienBullets.splice(i, 1);
              hit = true;
              beep(440, 0.06, 'square', 0.05);
              break;
            }
          }
        }
        // Bunker hit
        if (!hit && playerBullet) {
          for (const b of bunkers) {
            if (bunkerSolidAt(b, pb.x + 0.5, pb.y)) {
              erodeBunker(b, pb.x, pb.y, 2);
              hit = true;
              break;
            }
          }
        }
        if (hit) playerBullet = null;
      }
    }
  }

  // --- Alien grid stepping ---
  grid.stepTimer -= dt;
  if (grid.stepTimer <= 0 && state === STATE.PLAYING) stepGrid();
  if (state !== STATE.PLAYING) return;          // stepGrid may trigger game over

  // --- Alien firing ---
  alienFireTimer -= dt;
  if (alienFireTimer <= 0 && alienBullets.length < 3) {
    fireAlienBullet();
    alienFireTimer = fireInterval();
  }

  // --- Alien bullets ---
  for (let i = alienBullets.length - 1; i >= 0; i--) {
    const ab = alienBullets[i];
    ab.y += ab.speed * dt;
    ab.anim += dt;
    if (ab.anim > 0.1) { ab.anim = 0; ab.frame ^= 1; }
    if (ab.y + ab.h > GROUND_Y) { alienBullets.splice(i, 1); continue; }
    // Bunker hit
    let consumed = false;
    for (const b of bunkers) {
      if (bunkerSolidAt(b, ab.x + 1.5, ab.y + ab.h)) {
        erodeBunker(b, ab.x + 1.5, ab.y + ab.h, 2);
        consumed = true;
        break;
      }
    }
    if (consumed) { alienBullets.splice(i, 1); continue; }
    // Player hit
    if (player.alive && player.invuln <= 0 &&
        aabb(ab.x, ab.y, ab.w, ab.h, player.x, player.y, player.w, player.h)) {
      alienBullets.splice(i, 1);
      killPlayer();
      return;
    }
  }

  // Defensive: if all aliens are somehow gone, advance to the next wave.
  if (countAlive() === 0) { triggerWaveClear(); return; }

  // --- UFO ---
  if (ufo) {
    ufo.x += UFO_SPEED * ufo.dir * dt;
    if (ufo.x + ufo.w < -4 || ufo.x > W + 4) {
      ufo = null;
      ufoTimer = 20 + Math.random() * 10;
    }
  } else if (countAlive() > 4) {
    ufoTimer -= dt;
    if (ufoTimer <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      ufo = {
        x: dir > 0 ? -16 : W,
        w: spriteW(SPR.ufo),
        h: spriteH(SPR.ufo),
        dir,
        value: UFO_SCORES[Math.floor(Math.random() * UFO_SCORES.length)]
      };
      sfx.ufo();
    }
  }

  // --- Popups ---
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t -= dt;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }
}

// ---------- Render ----------
function text(str, x, y, color, align) {
  ctx.fillStyle = color || COL.green;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
}

function renderHUD() {
  text('SCORE', 8, 3, COL.green);
  text(String(score).padStart(5, '0'), 8, 12, COL.white);
  text('HI-SCORE', W / 2 + 14, 3, COL.green, 'center');
  text(String(hiScore).padStart(5, '0'), W / 2 + 14, 12, COL.white, 'center');
  // Ground line
  ctx.fillStyle = COL.green;
  ctx.fillRect(0, GROUND_Y, W, 1);
  // Lives as ship icons
  for (let i = 0; i < lives; i++) {
    drawSprite(SPR.ship, 0, 6 + i * 11, GROUND_Y + 5, COL.green);
  }
  text('WAVE ' + wave, W - 8, GROUND_Y + 6, COL.green, 'right');
  if (muted) text('MUTED', W - 8, 3, COL.dim, 'right');
}

function renderWorld() {
  // Bunkers
  ctx.fillStyle = COL.green;
  for (const b of bunkers) {
    for (let y = 0; y < b.h; y++) {
      for (let x = 0; x < b.w; x++) {
        if (b.px[y * b.w + x]) ctx.fillRect(b.x + x, b.y + y, 1, 1);
      }
    }
  }
  // Player (blinks while invulnerable / hidden while dead)
  if (player.alive && (player.invuln <= 0 || Math.floor(elapsed * 10) % 2 === 0)) {
    drawSprite(SPR.player, 0, Math.round(player.x), player.y, COL.green);
  }
  // Aliens
  for (const a of grid.aliens) {
    if (!a.alive) continue;
    const r = alienRect(a);
    drawSprite(TYPES[a.type].frames, grid.frame, r.x, r.y, COL.white);
  }
  // UFO
  if (ufo) drawSprite(SPR.ufo, 0, Math.round(ufo.x), UFO_Y, COL.red);
  // Player bullet
  if (playerBullet) {
    ctx.fillStyle = COL.white;
    ctx.fillRect(Math.round(playerBullet.x), Math.round(playerBullet.y), 1, 4);
  }
  // Alien bullets
  for (const ab of alienBullets) {
    drawSprite(ab.type === 'zig' ? SPR.zig : SPR.plunger, ab.frame,
               Math.round(ab.x), Math.round(ab.y), COL.white);
  }
  // Floating popups
  for (const p of popups) {
    text(p.text, p.center ? W / 2 : p.x, p.y, p.center ? COL.green : COL.yellow,
         p.center ? 'center' : 'center');
  }
}

function centeredBox(y, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(16, y, W - 32, h);
  ctx.strokeStyle = COL.green;
  ctx.lineWidth = 1;
  ctx.strokeRect(16.5, y + 0.5, W - 33, h - 1);
}

function renderMenu() {
  renderHUD();
  text('SPACE  INVADERS', W / 2, 38, COL.green, 'center');
  text('*SCORE ADVANCE TABLE*', W / 2, 62, COL.white, 'center');
  const rows = [
    [SPR.squid,   '= 30 POINTS'],
    [SPR.crab,    '= 20 POINTS'],
    [SPR.octopus, '= 10 POINTS'],
    [SPR.ufo,     '= ? MYSTERY']
  ];
  let y = 80;
  for (const [frames, label] of rows) {
    const w = spriteW(frames), h = spriteH(frames);
    drawSprite(frames, Math.floor(elapsed * 2) % 2, 66 - w / 2 + 14, y + (8 - h) / 2, COL.white);
    text(label, 92, y + 1, COL.green);
    y += 16;
  }
  if (Math.floor(elapsed * 2) % 2 === 0) {
    text('PRESS ENTER TO START', W / 2, 158, COL.white, 'center');
  }
  text('ARROWS/A,D MOVE   SPACE FIRE', W / 2, 190, COL.dim, 'center');
  text('P PAUSE   M MUTE', W / 2, 202, COL.dim, 'center');
  text('TAP FIRE TO START ON TOUCH', W / 2, 214, COL.dim, 'center');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.font = '8px "Courier New", monospace';

  if (state === STATE.MENU) {
    renderMenu();
    return;
  }

  renderHUD();
  renderWorld();

  if (state === STATE.PAUSED) {
    centeredBox(104, 40);
    text('PAUSED', W / 2, 118, COL.green, 'center');
    text('P TO RESUME', W / 2, 130, COL.dim, 'center');
  } else if (state === STATE.WAVE_CLEAR) {
    centeredBox(104, 40);
    text('WAVE ' + wave, W / 2, 112, COL.green, 'center');
    text('GET READY', W / 2, 128, COL.white, 'center');
  } else if (state === STATE.GAME_OVER) {
    centeredBox(92, 72);
    text('GAME OVER', W / 2, 100, COL.red, 'center');
    text('SCORE ' + score, W / 2, 116, COL.white, 'center');
    text('BEST  ' + hiScore, W / 2, 128, COL.white, 'center');
    if (Math.floor(elapsed * 2) % 2 === 0) {
      text('ENTER TO RESTART', W / 2, 146, COL.green, 'center');
    }
  }
}

// ---------- Main loop: fixed timestep accumulator ----------
let last = performance.now();
let acc = 0;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;    // clamp long frames (tab switches etc.)
  acc += dt;
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
